  title: Economic Simulation
  body: Build businesses, generate revenue, disrupt competitors, and race to $1,000,000.
- icon: ⚔️
  title: Conflict Cards
  body: Use action cards to raid, sabotage, or acquire rival enterprises.
- icon: 🌍
  title: Developing-World Theme
  body: Card art and mechanics grounded in the real economics of village-scale enterprise.
