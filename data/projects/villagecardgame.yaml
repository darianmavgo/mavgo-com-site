  where players build economic empires in a developing-world village. Collect $1,000,000
  to win by building legitimate enterprises or cornering illicit markets — but watch
  out for rival players.'
features:
- icon: 🃏
  title: Printable Cards
  body: Full card art and rules printable at home. Print, cut, and play — no manufacturing
