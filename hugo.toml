baseURL = "https://mavgo.com/"
locale = "en-US"
title = "Mavgo"
enableRobotsTXT = true
enableGitInfo = false

# No tags/categories archive pages — they'd only be empty noise in the sitemap.
disableKinds = ["taxonomy", "term"]

# Project pages live in content/projects/ but are served from the site root:
#   content/projects/banquet.md  ->  https://mavgo.com/banquet/
[permalinks]
  projects = "/:contentbasename/"

[author]
  name = "Darian Hickman"
  email = "darian@mavgo.com"

[params]
  description = "Mavgo is owned and operated by Darian Hickman. Mavgo serves as the home base of all software endeavors of Darian Hickman."
  github = "https://github.com/darianmavgo"
  email = "darian@mavgo.com"
  tagline = "Software by Darian Hickman"

[markup]
  [markup.highlight]
    style = "dracula"
    lineNos = false
    codeFences = true
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[[menus.main]]
  name = "Projects"
  url = "/#projects"
  weight = 1

[[menus.main]]
  name = "About"
  url = "/about/"
  weight = 2

[[menus.main]]
  name = "Work Log"
  url = "/work-log/"
  weight = 3

[[menus.main]]
  name = "Trading Journey"
  url = "/trading-journey/"
  weight = 4

[minify]
  disableHTML = false
  disableCSS = false
  disableJS = false
